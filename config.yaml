# PROJECT ATLAS CONFIG
# Edit these numbers. Save. Restart the dashboard.

account:
  starting_capital: 1000.0
  currency: USD
  mode: paper          # paper only for now

# SOROS-STYLE RISK RULES (aggressive learning account)
risk:
  max_risk_per_trade_pct: 8.0          # % of current equity
  max_daily_loss_pct: 25.0             # stop for the day
  max_weekly_loss_pct: 40.0
  kill_switch_drawdown_pct: 50.0       # hard freeze + post-mortem required
  max_position_pct: 45.0               # high concentration allowed
  max_open_positions: 5
  allow_shorts: true                   # enabled
  allow_options: true                  # enabled
  allow_margin: false                  # cash account only for now

# BROKER CONNECTION (paper-first, safety-gated)
# mode: simulate  -> in-process sim engine, no keys, no network (default)
# mode: paper     -> Alpaca PAPER sandbox (real API, NO real money). Add keys below.
# mode: live      -> Alpaca LIVE (REAL MONEY). Requires live_confirmed: true + keys.
# Get paper keys free at https://app.alpaca.markets/ (developer-first, commission-free).
broker:
  mode: simulate
  live_confirmed: false
  api_key: "REPLACE_WITH_YOUR_ALPACA_KEY"
  api_secret: "REPLACE_WITH_YOUR_ALPACA_SECRET"


# STRATEGY STYLE
strategy:
  style: soros
  require_high_conviction: true
  cut_losers_immediately: true
  no_averaging_down: true
  min_reward_to_risk: 2.5

# PIPELINE
pipeline:
  cheap_screen_first: true             # Claude review point #1
  require_edge_source: true            # Claude review point #3

# DASHBOARD
dashboard:
  title: "Project Atlas — Mission Control"
  port: 8501

# ACCESS CONTROL (per-user, approval-gated member portal)
# Friends can ONLY log in after the administrator approves them here on Telegram.
# max_members caps how many approved friends can exist at once.
access:
  max_members: 6
  admin_telegram_id: "8660692768"

# AUTONOMOUS TRADER (Soros-adapted, aggressive but HARD-CAPPED)
# Runs PAPER only. Every action passes the Risk Office + kill-switch.
# These are "the limits we set" — tune freely; they are enforced in code.
auto_trader:
  enabled: true                  # engine runs autonomously in paper (Dr. King authorized 2026-08-07)
  auto_start: true               # when true, engine launches itself at portal start (paper-only, autonomous)
  paper_only: true               # never trades live; live_confirmed must stay false
  book_reference: 100000.0       # engine's SHARE of the account = $100k (Dr. King's half). Your other $100k + margin is reserved for your manual trades; engine never touches it.
  # ---- Aggressive envelope (capped) ----
  max_capital_at_risk_pct: 40.0  # max % of equity exposed at once (aggressive but bounded)
  max_open_positions: 8
  max_single_position_pct: 20.0  # max % of book in one position
  max_premium_at_risk_per_option_trade_pct: 8.0  # options: max premium risk per trade
  min_reward_to_risk: 2.5
  min_conviction: 8              # high-conviction only (Soros-style)
  # ---- Options rules ----
  options_only_defined_risk: true   # vertical spreads only; NO naked shorts
  option_spread_type: "vertical"    # vertical debit/credit spreads
  # ---- Reinvestment ----
  reinvest_profits_pct: 100.0    # compound all realized option/position profits back into the book
  equity_ceiling: 500000.0       # stop compounding the book past this (take profits out beyond)
  # ---- Safety ----
  kill_switch_drawdown_pct: 35.0 # hard freeze if book draws down this much from peak
  max_daily_loss_pct: 20.0
  # ---- Signals (rule-based; not a guarantee of profit) ----
  signal_universe:               # small aggressive universe to start
    - "NVDA"
    - "TSLA"
    - "AAPL"
    - "AMD"
    - "META"
    - "COIN"
    - "SPY"
  loop_seconds: 300              # evaluate signals every 5 min
  # NOTE: this engine NEVER goes live. To use real money you must (a) set
  # broker.live_confirmed: true, (b) supply live keys, and (c) explicitly
  # flip auto_trader.paper_only: false — all three, deliberately.

